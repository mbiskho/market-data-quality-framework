[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-data-quality-framework"
version = "0.1.0"
description = "Dependency-free OHLCV market data validation and reporting"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
mdq = "mdq.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
